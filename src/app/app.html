<a class="visually-hidden-focusable skip-link" href="#main-content">Skip to collection</a>
<header class="site-header d-none d-md-block">
  <nav class="navbar container" aria-label="Main navigation">
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/">
      <span class="brand-mark" aria-hidden="true">M</span> MTG Collection
    </a>
    <ul class="nav desktop-nav">
      @for (item of navigation; track item.path) {
        <li class="nav-item">
          <a
            class="nav-link"
            [routerLink]="item.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            >{{ item.label }}</a
          >
        </li>
      }
    </ul>
  </nav>
</header>

<main id="main-content" class="container" tabindex="-1">
  <router-outlet />
</main>

<footer class="container site-footer">
  <span>MTG Collection Manager</span>
  <span>UI prototype · Sample data · Images from
    <a href="https://scryfall.com" target="_blank" rel="noopener">Scryfall</a>
  </span>
</footer>
<nav class="mobile-nav nav nav-fill fixed-bottom d-md-none" aria-label="Main navigation">
  @for (item of navigation; track item.path) {
    <a
      class="nav-link"
      [routerLink]="item.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span
      >{{ item.label }}
    </a>
  }
</nav>
